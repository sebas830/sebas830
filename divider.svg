<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" xmlns:c2pa="http://c2pa.org/manifest">
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#312E81" stroke-width="2"/>
