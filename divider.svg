    <animate attributeName="stroke-dashoffset" values="0;-24" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <g fill="#FACC15">
    <rect x="220" y="14" width="10" height="10"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="460" y="14" width="10" height="10"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="700" y="14" width="10" height="10"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="900" y="14" width="10" height="10"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>

  <g>
    <rect x="-18" y="15" width="3" height="3" fill="#06B6D4" opacity="0.3"/>
    <rect x="-26" y="19" width="3" height="3" fill="#06B6D4" opacity="0.2"/>
    <rect x="-34" y="23" width="3" height="3" fill="#06B6D4" opacity="0.1"/>
    <rect x="-12" y="12" width="14" height="16" fill="#00F5FF"/>
    <rect x="-6" y="16" width="4" height="4" fill="#050816"/>
    <rect x="2" y="17" width="6" height="6" fill="#8B5CF6"/>
