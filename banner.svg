<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F5FF" stroke-opacity="0.14"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="260">
        <animate attributeName="width" values="0;1000;1000" keyTimes="0;0.25;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <g>
    <rect x="0" y="-40" width="1000" height="340" fill="url(#grid)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 40" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="80" cy="40" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="210" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="30" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="235" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="35" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="215" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="150" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#reveal)" filter="url(#glow)">
    <text x="500" y="125" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold" letter-spacing="6" fill="#FFFFFF">SEBASTIAN RAMIREZ</text>
    <text x="500" y="168" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" letter-spacing="4" fill="#00F5FF">SYSTEMS ENGINEER // SOFTWARE DEVELOPER</text>
  </g>

  <text x="500" y="225" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="bold" letter-spacing="8" fill="#FFFFFF">
    &gt; PRESS START &lt;
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <rect x="0" y="0" width="1000" height="4" fill="#FFFFFF" opacity="0.10">
    <animate attributeName="y" values="-10;270" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
